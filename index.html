<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partner's Bike Showroom</title>
  <style>
    :root {
      --primary: #ffcc00;
      --dark: #1e1e1e;
      --light: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--dark);
      color: var(--light);
    }

    /* Full background image */

.hero-bg {
  background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
              url('back1.jpg') no-repeat center center/cover;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  position: relative;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.hero-content h1 img {
  height: 60px;
  margin-bottom: 20px;
}

.hero-content h1 {
  font-size: 3rem;
  margin: 0.5rem 0;
}

.hero-content p {
  font-size: 1.2rem;
  margin-bottom: 2rem;
}

.hero-content button {
  padding: 12px 24px;
  font-size: 1rem;
  background-color: #ff4d4d;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.hero-content button:hover {
  background-color: #e60000;
}


    footer {
      background-color: var(--dark);
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .hero-content h1 {
        font-size: 32px;
      }
      .hero-content p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <section class="hero-bg">
    <div class="hero-content">
      <h1>Welcome to Partner's Bike Showroom</h1>
      <p>Discover your next dream bike with us. Adventure, Speed, Style – we have it all.</p>
      <button onclick="location='models.html'">Explore Bikes</button>
    </div>
  </section>

  <footer>
    &copy; 2026 Partner's Bike Showroom. Built for Riders.
  </footer>
</body>
</html>
